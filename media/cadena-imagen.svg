<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="t d"><title id="t">Capas de una imagen creíble</title><desc id="d">Forma, material, luz, cámara y render colaboran para una imagen creíble.</desc><rect width="1000" height="440" fill="#f1f5f9"/><g font-family="Arial" fill="#153049"><text x="35" y="55" font-size="30">La imagen es una cadena de decisiones</text><g fill="#d6e5f2" stroke="#345575" stroke-width="2"><rect x="30" y="115" width="165" height="120" rx="12"/><rect x="225" y="115" width="165" height="120" rx="12"/><rect x="420" y="115" width="165" height="120" rx="12"/><rect x="615" y="115" width="165" height="120" rx="12"/><rect x="810" y="115" width="165" height="120" rx="12"/></g><g font-size="24" text-anchor="middle"><text x="112" y="158">Forma</text><text x="307" y="158">Material</text><text x="502" y="158">Luz</text><text x="697" y="158">Cámara</text><text x="892" y="158">Render</text></g><g font-size="18" text-anchor="middle"><text x="112" y="194">Proporción</text><text x="112" y="217">y bordes</text><text x="307" y="194">Respuesta</text><text x="307" y="217">de superficie</text><text x="502" y="194">Volumen</text><text x="502" y="217">y reflejos</text><text x="697" y="194">Encuadre</text><text x="697" y="217">y perspectiva</text><text x="892" y="194">Muestreo</text><text x="892" y="217">y color</text></g><g stroke="#345575" stroke-width="3" fill="none"><path d="M199 175H220M215 168L222 175L215 182M394 175H415M410 168L417 175L410 182M589 175H610M605 168L612 175L605 182M784 175H805M800 168L807 175L800 182"/></g><text x="35" y="295" font-size="22">Compara una variable cada vez y conserva una referencia.</text><text x="35" y="335" font-size="22">Más muestras reducen ruido; no corrigen proporción o composición.</text><text x="35" y="390" font-size="18">Esquema docente. La posproducción reúne y ajusta resultados sin reemplazar la escena.</text></g></svg>
