<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Punto, arista y cara</title><desc id="d">Tres ejes identifican un punto. Conexiones forman aristas y superficies forman caras.</desc><rect width="900" height="500" fill="#f1f5f9"/><g font-family="Arial" fill="#153049"><text x="35" y="50" font-size="30">De una posición a una superficie</text><g stroke-width="4"><path d="M190 315H340" stroke="#b22636"/><path d="M190 315L90 405" stroke="#168050"/><path d="M190 315V140" stroke="#176bb6"/></g><g font-size="23"><text x="345" y="321" fill="#b22636">X</text><text x="65" y="428" fill="#168050">Y</text><text x="183" y="128" fill="#176bb6">Z</text><text x="195" y="344">(0,0,0)</text></g><path d="M190 315L280 355L280 200" stroke="#798b9d" stroke-dasharray="8 5" fill="none"/><circle cx="280" cy="200" r="9" fill="#6b3295"/><text x="292" y="190" font-size="22">P(X,Y,Z)</text><text x="70" y="465" font-size="18">Punto ideal: no tiene tamaño.</text><circle cx="455" cy="200" r="8" fill="#6b3295"/><circle cx="600" cy="200" r="8" fill="#6b3295"/><path d="M455 200H600" stroke="#153049" stroke-width="4"/><text x="450" y="255" font-size="24">Arista: conexión</text><path d="M690 160L835 160L800 300L665 300Z" fill="#adcbe6" stroke="#153049" stroke-width="4"/><text x="670" y="345" font-size="24">Cara: superficie</text><text x="450" y="410" font-size="19">Una malla relaciona vértices, aristas y caras.</text><text x="450" y="440" font-size="19">Esquema docente; no es captura de Blender.</text></g></svg>
