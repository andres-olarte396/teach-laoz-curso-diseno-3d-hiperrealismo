<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="t d"><title id="t">Conexiones básicas de materiales PBR</title><desc id="d">Color sRGB a Base Color, rugosidad Non-Color a Roughness, normal Non-Color mediante Normal Map a Normal.</desc><rect width="1000" height="550" fill="#f1f5f9"/><g font-family="Arial" fill="#153049"><text x="35" y="48" font-size="28">Una imagen de color y un mapa de datos son distintos</text><g fill="#d6e5f2" stroke="#345575" stroke-width="2"><rect x="35" y="95" width="260" height="95" rx="10"/><rect x="35" y="220" width="260" height="95" rx="10"/><rect x="35" y="345" width="260" height="95" rx="10"/><rect x="380" y="345" width="205" height="95" rx="10"/><rect x="650" y="95" width="300" height="345" rx="10"/></g><g font-size="23"><text x="55" y="130">Image Texture: color</text><text x="55" y="165">Color Space: sRGB*</text><text x="55" y="255">Image Texture: rough</text><text x="55" y="290">Color Space: Non-Color</text><text x="55" y="380">Image Texture: normal</text><text x="55" y="415">Color Space: Non-Color</text><text x="400" y="380">Normal Map</text><text x="400" y="415">Tangent Space</text><text x="670" y="130">Principled BSDF</text><text x="670" y="180">Base Color</text><text x="670" y="280">Roughness</text><text x="670" y="395">Normal</text></g><g fill="none" stroke="#6b3295" stroke-width="4"><path d="M295 145H610V174H650"/><path d="M295 268H650"/><path d="M295 395H380M585 395H650"/></g><text x="35" y="485" font-size="20">*Para una etiqueta PNG de color codificada en sRGB. Verifica otros recursos.</text><text x="35" y="520" font-size="19">Mapa normal no es mapa de altura: altura va por Bump. Esquema, no captura de Blender.</text></g></svg>
