<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="t d"><title id="t">Montaje mediante Alpha Over</title><desc id="d">Fotografía al fondo, imagen RGBA renderizada al primer plano, mezcla Alpha Over a Composite.</desc><rect width="1000" height="490" fill="#f1f5f9"/><g font-family="Arial" fill="#153049"><text x="35" y="48" font-size="28">Montaje: define el fondo, el frente y su alfa</text><g fill="#d6e5f2" stroke="#345575" stroke-width="2"><rect x="35" y="100" width="280" height="105" rx="10"/><rect x="35" y="255" width="280" height="105" rx="10"/><rect x="435" y="160" width="245" height="180" rx="10"/><rect x="775" y="205" width="195" height="105" rx="10"/></g><g font-size="23"><text x="55" y="135">Image: fotografía</text><text x="55" y="175">Fondo (Background)</text><text x="55" y="290">Render Layers: Image</text><text x="55" y="330">Frente RGBA</text><text x="455" y="195">Alpha Over</text><text x="455" y="230">Factor 1</text><text x="455" y="270">Imagen de fondo</text><text x="455" y="310">Imagen de frente</text><text x="795" y="250">Composite</text></g><g fill="none" stroke="#6b3295" stroke-width="4"><path d="M315 150H380V263H435M315 310H435M680 255H775"/></g><text x="35" y="410" font-size="20">Comprueba alfa Straight/Premultiplied de cada imagen; bordes oscuros no son una sombra.</text><text x="35" y="450" font-size="19">Usa transparencia del render y revisa perspectiva, contacto, luz y color. Esquema docente.</text></g></svg>
